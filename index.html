<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance</title>
<style>
  :root{--bg:#eef2f6;--card:#fff;--ink:#14202b;--muted:#5b6b7a;--line:#d5dde5;--accent:#0f5fd7;--ok:#13795b}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17222e;--ink:#e8eef4;--muted:#94a3b3;--line:#2a3846;--accent:#4aa8e6;--ok:#4cc9a0}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
  h1{margin:0 0 4px;font-size:1.25rem}
  p{margin:0 0 18px;color:var(--muted)}
  .clock{font-size:2.6rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:0}
  .date{color:var(--muted);margin:0 0 22px}
  label{display:block;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:12px;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px}
  button{width:100%;margin-top:12px;padding:14px;font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:8px;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:8px;padding:8px}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .result{margin-top:16px;padding:14px;border-radius:8px;border:1px solid var(--ok);color:var(--ok);font-weight:600}
  .error{margin-top:12px;color:#c0392b}
  ul{list-style:none;padding:0;margin:8px 0 0;color:var(--muted);font-variant-numeric:tabular-nums;max-height:240px;overflow-y:auto}
  li{padding:6px 0;border-top:1px solid var(--line)}
  h2{font-size:1rem;margin:22px 0 0}
  .logo{display:block;max-width:100%;max-height:72px;margin:0 0 18px}
  .quote{margin:0 0 20px;padding-left:12px;border-left:3px solid var(--accent);font-style:italic;color:var(--ink)}
  [hidden]{display:none!important}

  /* ---- Living sky: the scene follows the real time of day ---- */
  body{--card:rgba(255,255,255,.88);--ink:#13202e;--muted:#46586a;--line:rgba(19,32,46,.18);--accent:#1a5ca0;--ok:#0e7a57;--orange:#f58220;color-scheme:light;overflow-x:hidden}
  .scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,#f6fafe,#d9eaf7)}

  main{position:relative;z-index:1;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);background:var(--card);animation:rise .9s cubic-bezier(.2,.7,.2,1) both;box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .logo{animation:floaty 4s ease-in-out infinite}
  .clock{animation:glow 3s ease-in-out infinite}
  #login>*,#app:not([hidden])>*{animation:fadeUp .6s cubic-bezier(.2,.7,.2,1) both}
  #login>:nth-child(1),#app>:nth-child(1){animation-delay:.2s}
  #login>:nth-child(2),#app>:nth-child(2){animation-delay:.3s}
  #login>:nth-child(3),#app>:nth-child(3){animation-delay:.4s}
  #login>:nth-child(4),#app>:nth-child(4){animation-delay:.5s}
  #login>:nth-child(5),#app>:nth-child(5){animation-delay:.6s}
  #login>:nth-child(6),#app>:nth-child(6){animation-delay:.7s}
  button{position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .2s ease,filter .2s ease}
  button:not(.ghost):hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,95,215,.4);filter:brightness(1.06)}
  button:active{transform:scale(.98)}
  button:not(.ghost)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,147,209,.35);outline:none}
  .result:not([hidden]){animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .quote{animation:fadeUp .6s .3s both,shimmerBorder 3s ease-in-out infinite}
  li{animation:fadeUp .4s both}
  .confetti{position:fixed;width:8px;height:12px;z-index:9;pointer-events:none;animation:conf 1.5s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes conf{to{transform:translate(var(--dx),calc(var(--dy) + 280px)) rotate(var(--r));opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(36px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes glow{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 18px rgba(245,130,32,.55)}}
  @keyframes shine{0%,60%{left:-60%}100%{left:130%}}
  @keyframes pop{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
  @keyframes shimmerBorder{0%,100%{border-left-color:var(--accent)}50%{border-left-color:var(--orange)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes cloudmove{from{translate:-30vw 0}to{translate:130vw 0}}
  @keyframes fly{from{left:-5%;translate:0 0}50%{translate:0 -30px}to{left:105%;translate:0 10px}}
  @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.5)}}
  @keyframes sway{from{transform:scaleX(1)}to{transform:scaleX(1.05)}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  .logowrap{display:inline-block;background:#fff;border-radius:12px;padding:8px 14px;margin:0 0 16px;box-shadow:0 2px 12px rgba(0,0,0,.14)}
  .logowrap .logo{margin:0;max-height:62px;width:auto;max-width:100%}

  /* ---- Brand theme: logo blue + orange ---- */
  h1,.clock{color:var(--accent)}
  button:not(.ghost){background:var(--orange);color:#0d2b52}
  button:not(.ghost):hover{box-shadow:0 8px 20px rgba(245,130,32,.45)}
  main::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:14px 14px 0 0;background:linear-gradient(90deg,#1a5ca0,#2e93d1 55%,#f58220)}
  .sun{background:radial-gradient(circle,#fff3d6 0 30%,#ffb04a 62%,#f58220);box-shadow:0 0 70px 24px rgba(245,130,32,.55)}
  .sun::before{background:repeating-conic-gradient(rgba(255,190,110,.42) 0 7deg,transparent 7deg 22deg)}

  /* ---- Brand background: logo-colored waves and soft circles ---- */
  .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.4}
  .orb.o1{width:380px;height:380px;background:#2e93d1;top:-120px;left:-100px;animation:orbfloat 18s ease-in-out infinite alternate}
  .orb.o2{width:320px;height:320px;background:#f58220;top:6%;right:-90px;opacity:.3;animation:orbfloat 22s ease-in-out infinite alternate-reverse}
  @keyframes orbfloat{to{transform:translate(70px,60px) scale(1.18)}}

  /* ---- Animated brand background ---- */
  .scene{background:linear-gradient(120deg,#f6fafe,#d9eaf7,#fdebd8,#d9eaf7);background-size:300% 300%;animation:bgshift 22s ease infinite}
  .wave{position:absolute;left:0;bottom:0;width:200%;height:46vh}
  .wave.a{animation:waveL 14s linear infinite}
  .wave.b{animation:waveR 20s linear infinite}
  .wave.c{animation:waveL 28s linear infinite}
  .float{position:absolute;inset:0}
  .float i,.float .ic{position:absolute;bottom:-60px}
  .float i{border-radius:50%;animation:rise2 linear infinite,swayx ease-in-out infinite alternate}
  .float .ic{opacity:.26;animation:rise2 linear infinite,tilt ease-in-out infinite alternate}
  @keyframes bgshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes waveL{to{transform:translateX(-50%)}}
  @keyframes waveR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
  @keyframes rise2{from{transform:translateY(0)}to{transform:translateY(-118vh)}}
  @keyframes swayx{from{translate:-24px 0}to{translate:24px 0}}
  @keyframes tilt{from{rotate:-20deg}to{rotate:20deg}}
</style>
</head>

  <p class="clock" id="clock" aria-live="off">--:--:--</p>
  <p class="date" id="date"></p>

  <section id="login">
    <h1 id="hi">Sign in</h1>
    <p>Enter your full name and PIN. If this is your first time, the PIN you enter becomes your PIN.</p>
    <label for="name">Full name</label>
    <input id="name" autocomplete="name" maxlength="60">
    <label for="pin" style="margin-top:12px">PIN (4 to 8 digits)</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">
    <button id="loginBtn">Sign in</button>
    <div class="error" id="loginErr" role="alert"></div>
  </section>

  <section id="app" hidden>
    <h1>Hello, <span id="who"></span></h1>
    <p class="quote">“I know you will work hard today.”</p>
    <p>Select the button to record your attendance now.</p>
    <button id="checkin">Record attendance</button>
    <div class="result" id="result" role="status" hidden></div>
    <div class="error" id="err" role="alert"></div>
    <h2 id="histTitle">All your check-ins</h2>
    <ul id="history"></ul>
    <button class="ghost" id="logout">Sign out</button>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (iso) => new Date(iso).toLocaleString([], {dateStyle:"full", timeStyle:"medium"});
let user = "", userPin = "";

setInterval(tick, 1000); tick();
function tick(){
  const n = new Date();
  $("clock").textContent = n.toLocaleTimeString([], {hour12:false});
  $("date").textContent = n.toLocaleDateString([], {dateStyle:"full"});
}

function renderHistory(records){
  $("history").innerHTML = "";
  $("histTitle").textContent = "All your check-ins" + (records && records.length ? " (" + records.length + ")" : "");
  if (!records || !records.length) { $("history").innerHTML = "<li>No check-ins yet.</li>"; return; }
  records.forEach((t) => { const li = document.createElement("li"); li.textContent = fmt(t); $("history").appendChild(li); });
}

async function call(action, name, pin){
  const r = await fetch("/api/attendance", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({action, name, pin})
  });
  let d = {};
  try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(d.error || "Request failed.");
  return d;
}

function show(signedIn){
  $("login").hidden = signedIn; $("app").hidden = !signedIn;
  $("who").textContent = user;
}

$("loginBtn").onclick = async () => {
  const name = $("name").value.trim().replace(/\s+/g, " ");
  const pin = $("pin").value.trim();
  $("loginErr").textContent = "";
  if (!name) { $("loginErr").textContent = "Enter your name to continue."; return; }
  if (!/^\d{4,8}$/.test(pin)) { $("loginErr").textContent = "PIN must be 4 to 8 digits."; return; }
  const btn = $("loginBtn"); btn.disabled = true;
  try {
    const d = await call("login", name, pin);
    user = d.name; userPin = pin;
    $("pin").value = "";
    renderHistory(d.records);
    show(true);
    if (d.created) { $("result").hidden = false; $("result").textContent = "PIN saved. Use it next time you sign in."; }
  } catch (e) { $("loginErr").textContent = e.message; }
  finally { btn.disabled = false; }
};
["name","pin"].forEach((id) => $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); }));

$("logout").onclick = () => {
  user = ""; userPin = ""; $("result").hidden = true; $("err").textContent = ""; show(false);
};

$("checkin").onclick = async () => {
  const btn = $("checkin"); btn.disabled = true; $("err").textContent = "";
  try {
    const d = await call("checkin", user, userPin);
    $("result").hidden = false;
    $("result").textContent = "Attendance recorded: " + fmt(d.checked_in_at);
    burst();
    renderHistory(d.records);
  } catch (e) {
    $("err").textContent = "Could not record attendance. " + e.message;
  } finally { btn.disabled = false; }
};

(function(){
  const h=new Date().getHours();
  $("hi").textContent=(h<12?"Good morning":h<17?"Good afternoon":h<21?"Good evening":"Working late")+", sign in";
})();

(function(){
  const box=$("float"), cols=["#2e93d1","#f58220","#1a5ca0","#6ca9dc"], icons=["i-book","i-cap","i-pen"];
  const r=(a,b)=>a+Math.random()*(b-a);
  for(let i=0;i<16;i++){
    const e=document.createElement("i"), z=r(8,26);
    e.style.cssText="left:"+r(0,100)+"%;width:"+z+"px;height:"+z+"px;background:"+cols[i%4]+";opacity:"+r(.15,.4)+";animation-duration:"+r(14,30)+"s,"+r(4,8)+"s;animation-delay:-"+r(0,30)+"s,-"+r(0,8)+"s";
    box.appendChild(e);
  }
  const NS="http://www.w3.org/2000/svg";
  for(let i=0;i<8;i++){
    const v=document.createElementNS(NS,"svg"), u=document.createElementNS(NS,"use"), z=r(26,44);
    v.setAttribute("class","ic"); u.setAttribute("href","#"+icons[i%3]); v.appendChild(u);
    v.style.cssText="left:"+r(2,95)+"%;color:"+(i%2?"#f58220":"#1a5ca0")+";width:"+z+"px;height:"+z+"px;animation-duration:"+r(20,38)+"s,"+r(5,9)+"s;animation-delay:-"+r(0,38)+"s,-"+r(0,9)+"s";
    box.appendChild(v);
  }
})();

function burst(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=$("checkin").getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  const cols=["#f58220","#ffb04a","#2e93d1","#6ca9dc","#1a5ca0"];
  for(let i=0;i<50;i++){
    const c=document.createElement("b"), a=Math.random()*Math.PI*2, v=90+Math.random()*200;
    c.className="confetti";
    c.style.cssText="left:"+cx+"px;top:"+cy+"px;background:"+cols[i%5]+";--dx:"+Math.cos(a)*v+"px;--dy:"+(Math.sin(a)*v-90)+"px;--r:"+(Math.random()*720-360)+"deg";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),1600);
  }
}
</script>
</body>
</html>
